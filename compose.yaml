# Single-command DAST POC (NFR-5): pilot app + ZAP + runner on one network.
#
#   docker compose up --build --abort-on-container-exit --exit-code-from runner
#
# The runner authenticates through ZAP, runs a bounded scope-enforced scan, and exits with the
# Phase 1 gate as its code (0 = pass). Images are pinned by digest for reproducibility (NFR-1;
# see versions.lock). Detection records land in ./out/records.json.
name: ssd-dast-poc

services:
  juice:
    image: bkimminich/juice-shop@sha256:73c53fbf442e8337b3ea3d98c7e8550308854701ebdfce4cc39768f36b75430e
    networks: [dast]
    healthcheck:
      # node is present in the juice-shop image; check the app answers on :3000.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  zap:
    image: zaproxy/zap-stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    # -silent (no phone-home) + api.addrs allow-list so the API accepts calls from the runner.
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080 -silent
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    networks: [dast]

  runner:
    build:
      context: .
      dockerfile: Containerfile
    depends_on:
      juice:
        condition: service_healthy   # wait until the app actually serves
      zap:
        condition: service_started   # runner's wait_ready() then polls the ZAP API
    networks: [dast]
    command:
      - "--scope=security/dast/juice-shop/scope.json"
      - "--flow=security/dast/juice-shop/flow.py"
      - "--base-url=http://juice:3000"
      - "--zap-api=http://zap:8080"
      - "--zap-proxy=http://zap:8080"
      - "--records-out=/app/out/records.json"
    volumes:
      - ./out:/app/out

networks:
  dast: {}
