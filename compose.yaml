# Single-command DAST POC (NFR-5): pilot app + ZAP + runner on one network.
#
#   docker compose up --build --abort-on-container-exit --exit-code-from runner
#
# The runner authenticates through ZAP, runs a bounded scope-enforced scan, and exits with the
# Phase 1 gate as its code (0 = pass). Images are pinned by digest for reproducibility (NFR-1;
# see versions.lock). Detection records land in ./out/records.json.
name: ssd-dast-poc

services:
  juice:
    image: bkimminich/juice-shop@sha256:73c53fbf442e8337b3ea3d98c7e8550308854701ebdfce4cc39768f36b75430e
    networks: [dast]
    # No compose healthcheck: the juice-shop image is distroless (no /bin/sh), so shell-based
    # healthchecks can't run. Readiness is handled by the runner's wait_ready() instead, which
    # polls http://juice:3000 (and the ZAP API) before scanning.

  zap:
    image: zaproxy/zap-stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    # -silent (no phone-home) + api.addrs allow-list so the API accepts calls from the runner.
    # The aliases are what make ZAP answer as its API on a published host port: ZAP only treats
    # a request as its own when the Host header names an address it knows itself by, and a
    # published port rewrites neither. Without them, `curl 127.0.0.1:8090/JSON/...` is proxied
    # to 127.0.0.1:8090 *inside the container* and comes back as an empty reply (see §6).
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080 -silent
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config network.localServers.aliases.alias(0).name=127.0.0.1
      -config network.localServers.aliases.alias(0).enabled=true
      -config network.localServers.aliases.alias(1).name=localhost
      -config network.localServers.aliases.alias(1).enabled=true
    networks: [dast]

  # Additional onboarded targets. Profiles keep the default Juice Shop demo unchanged.
  # These services have no host ports; expose them only with a local compose override when
  # authoring from the host. ZAP and the containerized runner reach them on the dast network.
  dvwa:
    profiles: [dvwa]
    image: vulnerables/web-dvwa@sha256:dae203fe11646a86937bf04db0079adef295f426da68a92b40e3b181f337daa7
    networks: [dast]

  webgoat:
    profiles: [webgoat]
    image: webgoat/webgoat@sha256:d4ac9fc2b0a41b68d64dedde684f4783aa60cc785838435a6d5bd5a25b387497
    networks: [dast]
    environment:
      # Avoid ZAP's own API/proxy port; base_url is http://webgoat:8083.
      WEBGOAT_HOST: "0.0.0.0"
      WEBGOAT_PORT: "8083"

  # Not a vulnerable app: a lab whose /gate validates its input server-side, so the pages behind
  # it are reachable only by answering the question it states (see labs/semgate/server.py). Built
  # from the runner image because it is stdlib-only Python and needs no image of its own.
  semgate:
    profiles: [semgate]
    build:
      context: .
      dockerfile: Containerfile
    entrypoint: ["python", "-m", "labs.semgate.server", "--port", "8084"]
    networks: [dast]
    environment:
      # No defaults: the lab refuses to start without the account the operator exports.
      SEMGATE_USER: ${SEMGATE_USER:?export SEMGATE_USER}
      SEMGATE_PASS: ${SEMGATE_PASS:?export SEMGATE_PASS}

  runner:
    build:
      context: .
      dockerfile: Containerfile
    # Both only need to have STARTED; the runner's wait_ready() polls until each actually
    # serves (juice-shop is distroless so a compose healthcheck isn't possible — see above).
    depends_on: [juice, zap]
    networks: [dast]
    environment:
      # Chromium runs as root with a small /dev/shm in-container; enable the needed flags.
      RUNNER_CHROMIUM_NO_SANDBOX: "1"
    command:
      - "--scope=security/dast/juice-shop/scope.json"
      - "--flow=security/dast/juice-shop/flow.py"
      - "--base-url=http://juice:3000"
      - "--zap-api=http://zap:8080"
      - "--zap-proxy=http://zap:8080"
      - "--records-out=/app/out/records.json"
    volumes:
      - ./out:/app/out

networks:
  dast: {}
