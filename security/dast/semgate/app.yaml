# semgate - the lab target for the one failure class the other apps cannot show.
#
# WebGoat and DVWA accept any input, so an operator-approved value gets a crawler through every
# form and deterministic-vs-assisted ties by construction. Here /gate asks a question generated
# per page load and refuses a wrong answer, and three pages behind it are 403 until it is passed.
# `answer` is therefore left to inference rather than approved in test_data: no fixed value could
# work. Run the target first (labs/semgate/server.py), then author both arms against it.
#
#   export SEMGATE_USER=... SEMGATE_PASS=...
#   podman compose --profile semgate up -d semgate
#   python -m dast author semgate --explore --no-llm --zap-proxy http://127.0.0.1:8090
#   python -m dast author semgate --explore --require-llm --zap-proxy http://127.0.0.1:8090

app_id: semgate
environment_class: dev
data_policy: disposable
base_url: http://semgate:8084

scope:
  allow: [semgate]
  avoid_actions: [logout, reset, delete]

auth:
  mode: form
  login_url: /signin
  steps:
    - {action: fill, selector: "input[name=user]", value: identifier}
    - {action: fill, selector: "input[name=pass]", value: secret}
    - {action: click, selector: "button[type=submit]"}
  proof:
    selector: "#whoami"
  identity: provisioned
  credentials:
    email_env: SEMGATE_USER
    password_env: SEMGATE_PASS
  storage_state: .secrets/semgate-storageState.json

record:
  authenticated_routes:
    - /home
    - /gate

explore:
  seed_routes:
    - /home
  # The gate is the only write endpoint, and it mutates nothing beyond a cookie on the walk's own
  # session; the lab holds no data to damage.
  write_mode: allow
  safe_forms:
    - /gate
  # `note` is an ordinary field the operator can answer in advance. `answer` cannot be: the
  # question is reissued per page load, so it is declared inferable instead, bounded to a short
  # number. That bound is what keeps the planner's freedom to a value the gate can only accept
  # or reject.
  test_data:
    note: "dast-test"
  inferred_fields:
    answer:
      pattern: "^[0-9]{1,3}$"
      max_length: 3
      note: "Answer to the arithmetic question /gate states; regenerated per load."
  budgets:
    max_pages: 25

scan:
  policy:
    attack_strength: medium
    alert_threshold: medium
  budgets:
    max_scan_min: 3
