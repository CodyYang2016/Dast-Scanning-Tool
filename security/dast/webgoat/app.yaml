# OWASP WebGoat - the third onboarded application, and the test of the config-only claim.
#
# WebGoat is a Spring Boot application with a JSESSIONID cookie and selector-based auth proof.
# Register a test account through the signup form before authoring; passwords are 6-10 chars.

app_id: webgoat
environment_class: dev
base_url: http://webgoat:8083

scope:
  allow: [webgoat]
  avoid_actions: [logout, reset, delete]

auth:
  mode: form
  login_url: /WebGoat/login
  steps:
    - {action: fill, selector: "input[name=username]", value: identifier}
    - {action: fill, selector: "input[name=password]", value: secret}
    - {action: click, selector: "button[type=submit]"}
  proof:
    selector: "#menu-container"
  identity: provisioned
  credentials:
    email_env: WEBGOAT_USER
    password_env: WEBGOAT_PASS
  storage_state: .secrets/webgoat-storageState.json

record:
  authenticated_routes:
    - /WebGoat/start.mvc
    - /WebGoat/service/lessonmenu.mvc
    - /WebGoat/service/lessonprogress.mvc

api:
  patterns: ["/service/", "/WebGoat/service/"]

explore:
  seed_routes:
    - /WebGoat/start.mvc
    - /WebGoat/service/lessonmenu.mvc
    # The lesson page itself: /start.mvc builds its menu in JavaScript, so nothing submittable
    # is reachable from the seed by following links.
    - /WebGoat/SqlInjection.lesson
  # Writes stay denied by posture; these endpoints are the only exceptions, named exactly as the
  # lesson forms post to them. Each is an idempotent SQL-injection exercise against WebGoat's
  # own throwaway in-memory database, in a disposable dev container.
  write_mode: deny
  safe_forms:
    - /WebGoat/SqlInjection/attack2
    - /WebGoat/SqlInjection/attack3
    - /WebGoat/SqlInjection/attack4
    - /WebGoat/SqlInjection/attack5
    - /WebGoat/SqlInjection/assignment5a
    - /WebGoat/SqlInjection/assignment5b
    - /WebGoat/SqlInjection/attack8
    - /WebGoat/SqlInjection/attack9
    - /WebGoat/SqlInjection/attack10
  # Disposable values for the lesson fields, benign by design: the point is to reach the
  # endpoint with a well-formed request, not to solve the lesson. No payloads -- the scanner
  # supplies those once the request is in its site tree.
  test_data:
    query: "SELECT * FROM employees"
    username: "dast-test"
    userid: "101"
    login_count: "1"
    name: "dast-test"
    auth_tan: "0000"
    action_string: "dast-test"
  budgets:
    max_pages: 25

scan:
  policy:
    attack_strength: medium
    alert_threshold: medium
    disabled_rules: ["40026"]
  budgets:
    max_scan_min: 4
