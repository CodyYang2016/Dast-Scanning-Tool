# Lint and the full test suite on every push and pull request (W9-3).
#
# The suite is pure — no Docker, no ZAP, Playwright imported lazily — so this needs nothing but
# Python and runs in seconds. It is what stops a fix from quietly un-fixing: two defects shipped
# to another copy of this tool precisely because its tests were not carried across with the code.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: Shell syntax
        run: |
          for f in *.sh scripts/*.sh; do bash -n "$f"; done

  windows:
    # The same suite on Windows, the Nationwide workstation's OS: the UI's job handling, file
    # paths and encodings. Browser tests stay on Linux (ui-e2e).
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q

  ui-frontend:
    # The web UI's front end: types, the frozen component tests, and a production build.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Component tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: The committed build is current
        # webui/frontend/dist is committed so the UI needs no Node to run. Rebuild and commit it
        # (`npm run build`) whenever the front end changes.
        working-directory: .
        run: git diff --exit-code --stat -- webui/frontend/dist && test -z "$(git status --porcelain -- webui/frontend/dist)"

  ui-e2e:
    # The frozen browser tests against a real `python -m dast ui` (live ones skip without LIVE=1).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json
      - name: Build the UI
        working-directory: webui/frontend
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: webui/frontend
        run: npx playwright test --reporter=line
