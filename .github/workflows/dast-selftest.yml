# Weekly self-test of the whole scanner (W3-1).
#
# Brings up pinned Juice Shop and ZAP with compose, scans with the hand-authored bundle (no LLM,
# no secrets), labels the findings, exports SARIF and keeps everything as an artifact. Juice
# Shop is deliberately vulnerable, so the run uses --expect-findings: if the scanner ever stops
# finding anything there, that is a broken scanner, and this job goes red. It is a canary for
# the tool, not a security gate for an application.
#
# It publishes NOTHING by default. The `upload` input exists so publishing can be switched on
# deliberately; it then attributes the results to this workflow's own commit — a visible demo
# choice, since Juice Shop's source is not in this repository (W1-8).
name: dast-selftest

on:
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      upload:
        description: "Also publish the SARIF to this repository's Security tab (dast/juice-shop)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The runner container writes as root; if it created ./out the host could not add the
      # labelled output beside it.
      - run: mkdir -p out

      - name: scan (compose, --expect-findings)
        run: docker compose up --build --abort-on-container-exit --exit-code-from runner

      - name: keep the container logs
        if: always()
        run: docker compose logs --no-color > out/compose.log 2>&1 || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt

      - name: label and export
        run: |
          python -m detections.lifecycle_diff out/records.json --app-id juice-shop \
            --state out/state.json --coverage out/coverage.json -o out/labeled.json
          python -m detections.sarif_export out/labeled.json --app-id juice-shop \
            --driver-version "ZAP 2.17.0" --category dast/juice-shop -o out/results.sarif
          python - <<'PY'
          import json, collections
          r = json.load(open("out/labeled.json"))
          c = json.load(open("out/coverage.json"))
          sev = collections.Counter(x["severity"] for x in r)
          print(f"{len(r)} findings over {len(c.get('routes', []))} routes:", dict(sev))
          PY

      - name: keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-selftest-${{ github.run_id }}
          path: |
            out/records.json
            out/coverage.json
            out/labeled.json
            out/results.sarif
            out/evidence/
            out/compose.log
          if-no-files-found: warn
          retention-days: 30

      - name: tear down
        if: always()
        run: docker compose down -v

  publish:
    # Off unless someone asks for it on a manual run.
    needs: selftest
    if: github.event_name == 'workflow_dispatch' && inputs.upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dast-selftest-${{ github.run_id }}
          path: out
      - name: upload SARIF
        env:
          GH_TOKEN: ${{ github.token }}
        # The deployment is named explicitly — this repository's commit, as a demo destination.
        run: |
          python -m detections.github_upload out/results.sarif \
            --owner "${{ github.repository_owner }}" --repo "${{ github.event.repository.name }}" \
            --ref "${{ github.ref }}" --commit "${{ github.sha }}"
