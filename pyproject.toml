[project]
name = "ssd-dast-poc"
version = "0.1.0"
description = "Agentic DAST platform POC — authenticated non-prod loop"
requires-python = ">=3.11"

[project.scripts]
dast = "dast:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
extend-exclude = [".venv", "out"]

[tool.ruff.lint]
# Start with the rules that find real defects — undefined names, unused imports, redefinitions,
# syntax errors — rather than a wall of style edits. Widen deliberately, one family at a time.
select = ["F", "E9"]
